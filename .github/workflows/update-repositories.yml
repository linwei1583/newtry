name: Update GitHub top repositories

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "data/repositories.json"

permissions:
  contents: write

concurrency:
  group: update-github-top-repositories
  cancel-in-progress: false

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GitHub repository ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_repositories.py
      - name: Commit updated ranking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json
          if git diff --cached --quiet; then
            echo "Repository ranking is unchanged."
          else
            git commit -m "Update GitHub top repositories"
            git push
          fi
